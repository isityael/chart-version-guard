when:
  - event: tag
    ref: refs/tags/v*-ym.*

steps:
  - name: build-and-push-ghcr
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/chart-version-guard
      dockerfile: Dockerfile
      context: .
      tags:
        - "${CI_COMMIT_SHA:0:8}"
        - main
        - "${CI_COMMIT_TAG}"
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      buildkit_driveropt: network=host
      cache_from: 'type=registry\,ref=ghcr.io/isityael/chart-version-guard:buildcache'
      cache_to: 'type=registry,ref=ghcr.io/isityael/chart-version-guard:buildcache,mode=max,ignore-error=true'
