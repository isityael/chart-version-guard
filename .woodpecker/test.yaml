when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:f108c65d14edfba45f4c75fd606d4bf5886babc38ffdd6183a599234004edfc0
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: go-test
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:9b23f00c5b36018b72742352c391e78c200193eea59c81d7043a19193a1a6a4b
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    commands:
      # CI_WORKSPACE only exists at step runtime, so it must be expanded here
      # (escaped) rather than in environment:, where it would be empty.
      - export GOMODCACHE="$${CI_WORKSPACE}/.go-mod-cache"
      - mkdir -p "$${GOMODCACHE}"
      - go mod verify
      - go test ./...
      - go vet ./...
      # Only check tracked sources; gofmt would otherwise walk the module cache.
      - test -z "$(gofmt -l $(git ls-files '*.go'))"

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:f108c65d14edfba45f4c75fd606d4bf5886babc38ffdd6183a599234004edfc0
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
