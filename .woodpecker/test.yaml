when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:35586c9bbbf82fd142216a037fd1f7f43f1cb09b21fb9f4bf491ddd7ea210ae0
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: go-test
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:baa8e6b0fe23dcfdcaec24af47e091660ba539685fe8340d0f5172227afadaf8
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
      GOMODCACHE: ${CI_WORKSPACE}/.go-mod-cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - go mod verify
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:35586c9bbbf82fd142216a037fd1f7f43f1cb09b21fb9f4bf491ddd7ea210ae0
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
