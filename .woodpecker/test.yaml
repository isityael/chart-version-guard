when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:6a5cf9cf3813e9b5a554f56dbc9c073cb24463b7bddd5b10e25790d732e68938
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: go-test
    image: dhi.io/golang:1.26.6-debian13-dev@sha256:08ff7030d9e3aa25230a57f6437e83ffe33995b9c88b0dfcab4f076ad3cc8f6c
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
      GOMODCACHE: ${CI_WORKSPACE}/.go-mod-cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - go mod verify
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:6a5cf9cf3813e9b5a554f56dbc9c073cb24463b7bddd5b10e25790d732e68938
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
