when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:d7fc21469c57b60320157831fc4703d4f1a4bc3c6b136129cf47f19e60570353
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: go-test
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:aba199ecba031bbf5b35d9b4ccc4111123dc5b0ab4a3a41644299b6882c3de53
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
      GOMODCACHE: ${CI_WORKSPACE}/.go-mod-cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - go mod verify
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:d7fc21469c57b60320157831fc4703d4f1a4bc3c6b136129cf47f19e60570353
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
