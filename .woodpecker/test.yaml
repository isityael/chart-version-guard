when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:ea47ef5b1500a639a5c68d6efd89d30d5a616d524ad2af0f9500cae60a2a207a
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: go-test
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:f8c4aa48a1c66bb538adf04156a25c09f143cacb74e3a0d0daa85ad712a833e9
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    commands:
      # CI_WORKSPACE only exists at step runtime, so it must be expanded here
      # (escaped) rather than in environment:, where it would be empty.
      - export GOMODCACHE="$${CI_WORKSPACE}/.go-mod-cache"
      - mkdir -p "$${GOMODCACHE}"
      - go mod verify
      - go test ./...
      - go vet ./...
      # Only check tracked sources; gofmt would otherwise walk the module cache.
      - test -z "$(gofmt -l $(git ls-files '*.go'))"

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:ea47ef5b1500a639a5c68d6efd89d30d5a616d524ad2af0f9500cae60a2a207a
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/chart-version-guard/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
